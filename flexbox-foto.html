
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flexbox Gallery</title>

    <link rel="stylesheet" href="css/flexbox-foto.css">
</head>
<body>

    <main class="gallery">

        <!-- BARIS PERTAMA: 3 FOTO -->
        <section class="row row-top">

            <div class="photo">
                <img src="img/panigalev4.jpg"
                     alt="Motor Ducati Panigale V4">
            </div>

            <div class="photo">
                <img src="img/r1m.jpg"
                     alt="Motor Yamaha R1M">
            </div>

            <div class="photo">
                <img src="img/s1000rr.jpg"
                     alt="Motor BMW S1000RR">
            </div>

        </section>


        <!-- BARIS KEDUA: 5 FOTO -->
        <section class="row row-bottom">

            <div class="photo">
                <img src="img/motor-1.jpg"
                     alt="Motor 01">
            </div>

            <div class="photo">
                <img src="img/MV Agusta F3.jpg"
                     alt="Motor 02">
            </div>

            <div class="photo">
                <img src="img/ZX10R.jpg"
                     alt="Motor 03">
            </div>

            <div class="photo">
                <img src="img/Aprilia.jpg"
                     alt="Motor 04">
            </div>

            <div class="photo">
                <img src="img/motor-5.jpg"
                     alt="Motor 05">
            </div>

        </section>

    </main>

</body>
</html>
